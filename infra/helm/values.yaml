# AIOS Helm 기본값.
# 환경별 차이는 values-staging.yaml / values-prod.yaml 로 덮어쓴다.
# 여기 있는 값은 "안전한 기본값"이어야 한다 — 실수로 그대로 배포돼도 사고가 나지 않도록.

image:
  # 컴포넌트별 이미지는 {repository}/api, /worker, /migrate 로 조합된다 (CI 푸시 경로와 동일)
  repository: ghcr.io/OWNER/REPO
  # tag는 반드시 배포 시 --set image.tag=<git-sha> 로 지정한다.
  # latest를 기본값으로 두지 않는 이유: 어떤 커밋이 떠 있는지 알 수 없게 되고 롤백이 불가능해진다.
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

api:
  replicaCount: 2
  # SSE 스트림이 길게 유지되므로 종료 유예를 넉넉히 준다.
  # main.ts의 25초 데드라인 + 여유 5초.
  terminationGracePeriodSeconds: 30
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 1Gi } # CPU limit을 두지 않는 이유는 아래 주석 참조
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

worker:
  replicaCount: 2
  # 인덱싱 잡이 진행 중일 수 있으므로 API보다 길게 준다 (worker.ts 데드라인 30초).
  terminationGracePeriodSeconds: 40
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { memory: 2Gi }

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  host: api.aios.example.com
  tls:
    enabled: true
    secretName: aios-tls
  annotations:
    # SSE를 위한 필수 설정 3종.
    # 이게 없으면 nginx가 응답을 버퍼링해 스트리밍이 "한 번에 뭉쳐서" 도착한다 —
    # 기능은 동작하는 것처럼 보이지만 사용자 체감은 완전히 망가진다.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # WebSocket(협업) 업그레이드
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"

# 마이그레이션은 앱보다 먼저, 딱 한 번 돈다.
# Helm hook(pre-install/pre-upgrade)을 쓰는 이유: 앱 파드가 각자 마이그레이션을 시도하면
# 경합이 나고, 롤백 시 스키마와 코드 버전이 어긋난다.
migration:
  enabled: true
  backoffLimit: 2
  activeDeadlineSeconds: 600
  # 마이그레이션 Job의 리소스도 조정 가능해야 한다.
  # 하드코딩하면 노드에 여유가 없을 때 Job이 Pending으로 멈추고, pre-upgrade 훅이라
  # **배포 전체가 그 자리에서 정지**한다(실제로 겪었다). 조정 손잡이가 없으면 손쓸 방법이 없다.
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

# 카나리: 새 버전에 트래픽 일부만 흘린다.
# weight=0 이면 카나리 Deployment를 만들지 않는다.
#
# 실제 비율은 "카나리 파드 수 / 전체 엔드포인트 수"다. replica가 적으면 granularity가 거칠다 —
# 실측: stable 2 + canary 1 → weight를 10으로 줬어도 실제 트래픽은 약 33%.
# 정밀한 비율이 필요하면 replica를 늘리거나(예: stable 9 + canary 1 = 10%)
# ingress-nginx의 canary annotation 또는 서비스 메시로 옮겨야 한다.
canary:
  weight: 0
  tag: "" # 비우면 image.tag 사용

# 시크릿은 차트에 넣지 않는다. 아래 이름의 Secret이 클러스터에 미리 존재해야 한다.
# (External Secrets Operator / Sealed Secrets / SOPS 중 무엇을 쓰든 결과물은 이 Secret)
secretName: aios-secrets

# 로그·메트릭
metrics:
  serviceMonitor:
    enabled: false # Prometheus Operator가 있을 때만 켠다
    interval: 30s

# 앱 설정 (비밀 아님)
config:
  NODE_ENV: production
  PORT: "8787"
  SANDBOX_IMAGE: "ghcr.io/OWNER/REPO/sandbox:latest"

nodeSelector: {}
tolerations: []
affinity: {}

# ---------- 공공통계 데이터셋 (DuckDB) ----------
#
# 설정하지 않으면 bigdata 도구가 아예 등록되지 않고 /v1/bigdata/* 라우트도 만들어지지 않는다.
# 데이터 없는 배포에서 LLM 이 존재하지 않는 도구를 부르며 실패하는 것을 막기 위한 설계다.
#
# 파일은 2.5GB 이고 런타임에는 **읽기 전용**이다. 이미지에 굽지 않는 이유:
#  - 이미지가 2.5GB 커져 롤아웃마다 그만큼을 모든 노드가 내려받는다
#  - 데이터가 갱신될 때마다 앱 이미지를 다시 빌드해야 한다 (코드와 데이터의 수명이 다르다)
# 그래서 PVC 로 분리하고, 데이터 갱신은 별도 Job 이 담당한다.
bigdata:
  enabled: false
  # 기존 PVC 이름. ReadOnlyMany 여야 여러 파드가 함께 붙을 수 있다.
  existingClaim: ""
  mountPath: /data/bigdata
  # 파일명. build.py db 가 만드는 이름과 같아야 한다.
  fileName: bigdata.duckdb
  # 분석 엔진 자원 상한. 명시하지 않으면 DuckDB 가 RAM 대부분(실측 12.7GiB)과 전 코어를 잡아
  # 같은 프로세스의 HTTP 처리를 굶기고, 심하면 프로세스가 죽는다 — 실제로 겪었다.
  memoryLimit: "2GB"
  threads: 4

# ---------- 로컬 추론 서버 ----------
#
# 이 값이 있으면 외부 AI 프로바이더 키가 하나도 없어도 제품이 정상 기동한다.
# 클러스터 안에 Ollama 등을 띄우고 그 서비스 주소를 준다.
localLlm:
  enabled: false
  baseUrl: ""            # 예: http://ollama.ai.svc.cluster.local:11434/v1
  models: "qwen3:8b"     # 실측 기준 최우수 (도구·한국어 모두 100%)
  embedModel: "bge-m3"
  # 임베딩 서버에 동시에 던질 최대 요청 수. 실측(bge-m3/CPU): 처리량은 4에서 포화하고
  # 더 올리면 지연만 나빠진다(4→25 에서 p95 5~7배). GPU 슬롯이 많으면 올린다.
  embedConcurrency: 4
  # 동시 생성 요청 상한. 초과분은 서버 큐에서 기다리다 HTTP 헤더 타임아웃(300초)에 걸려
  # 죽는다 — 실측으로 겪은 장애다. 우리 쪽에서 줄을 세우면 그 대기는 타임아웃 대상이 아니다.
  chatConcurrency: 2
  contextWindow: 32768
  # 임베딩 차원은 임베더가 정한다. bge-m3=1024, OpenAI=1536.
  # 스키마와 어긋나면 저장이 실패하므로 scripts/set-embedding-dim.mjs 로 맞춘다.
  embedDim: 1024

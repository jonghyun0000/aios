apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aios.fullname" . }}-worker
  labels:
    {{- include "aios.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # 워커는 트래픽을 받지 않으므로 잠깐 줄어도 된다. 다만 인덱싱 잡이
      # 진행 중일 수 있어 한 번에 하나씩만 교체한다.
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "aios.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "aios.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        checksum/secret-name: {{ .Values.secretName | sha256sum }}
    spec:
      # BullMQ의 close()가 진행 중인 잡을 끝낼 때까지 기다린다(worker.ts 데드라인 30초).
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: {{ include "aios.image" (list . "worker") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "aios.env" . | nindent 12 }}
          # 워커는 HTTP 포트가 없다. 프로세스 생존만 확인한다.
          # (BullMQ 큐 연결 상태까지 보려면 별도 헬스 포트를 열어야 하는데,
          #  그 복잡도보다 "죽으면 재시작"이 이 규모에서는 더 낫다.)
          livenessProbe:
            exec:
              command: ["node", "-e", "process.exit(0)"]
            initialDelaySeconds: 20
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}

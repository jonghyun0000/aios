# 로컬/CI용 전체 스택. 프로덕션 토폴로지는 docs/07-scaling-cost-bottleneck.md 참고.
#
# 기동 순서가 중요하다: postgres(healthy) → migrate(완료) → api/worker.
# 마이그레이션을 앱 부팅에 섞지 않는 이유: 앱 인스턴스가 N개면 N개가 동시에 마이그레이션을
# 시도하게 되고, 롤백 시 스키마와 코드 버전이 어긋난다. 별도 원샷 잡이 정답이다.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aios
      POSTGRES_PASSWORD: aios
      POSTGRES_DB: aios
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aios -d aios"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # 원샷 마이그레이션. api/worker는 이것이 성공적으로 끝난 뒤에만 뜬다.
  migrate:
    build:
      context: .
      dockerfile: infra/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgres://aios:aios@postgres:5432/aios
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile
      target: api
    environment:
      DATABASE_URL: postgres://aios:aios@postgres:5432/aios
      REDIS_URL: redis://redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-aios-sandbox:latest}
    ports: ["8787:8787"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      # 컨테이너에 curl이 없으므로 node로 검사한다 — 이미지에 도구를 추가하지 않기 위함.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: infra/Dockerfile
      target: worker
    environment:
      DATABASE_URL: postgres://aios:aios@postgres:5432/aios
      REDIS_URL: redis://redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-aios-sandbox:latest}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
  redisdata:

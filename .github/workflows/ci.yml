name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # 코드가 바뀌지 않아도 의존성에 새 권고가 공개된다. 푸시가 없는 주에도 audit job 이 돌게 한다.
  schedule:
    - cron: "17 3 * * 1"

# 최초 공개 업로드는 코드 검증만 한다. 패키지 게시·클라우드 배포 권한을 주지 않는다.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 프로덕션 의존성의 알려진 취약점 게이트.
  # 별도 job 인 이유: 코드는 그대로인데 새 권고 때문에 빨개지는 일이 생길 수 있다.
  # 그때 "테스트가 깨졌다"와 "의존성 권고가 나왔다"가 한눈에 구분돼야 한다.
  # high 이상만 막는다 — moderate/low 와 개발 전용 의존성까지 막으면 CI 가 상시 빨갛게 되어 무시하게 된다.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24 runtime
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.12.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # 락파일만 읽으므로 install 이 필요 없다.
      - name: Production dependency audit (high and above)
        run: pnpm run audit:prod

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 공식 릴리스의 불변 커밋에 고정. CI 코드 실행에 저장소 토큰을 남기지 않는다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24 runtime
        with:
          persist-credentials: false
      # package.json의 packageManager와 정확히 맞춘다. action의 "9"는 "9.12.0"과 충돌한다.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.12.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Container Node and pnpm contract (no deployment)
        run: |
          node scripts/check-container-contract.mjs
          node --test scripts/check-container-contract.test.mjs
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build
      - name: Portable unit tests with structured counts and explicit scope
        run: node scripts/verify-vitest.mjs unit
      - name: Read-only doctor and verification boundary tests
        run: node --test scripts/dev-up.test.mjs scripts/doctor.test.mjs scripts/license-policy.test.mjs scripts/public-demo-policy.test.mjs scripts/verification-policy.test.mjs scripts/verification-report.test.mjs scripts/verify-vitest.test.mjs scripts/verify-app-a11y.test.mjs
      - name: Install Chromium for isolated browser tests
        run: pnpm --filter @aios/web exec playwright install --with-deps chromium
      - name: Public demo browser regression
        run: node scripts/verify-public-demo.mjs
      - name: Actual app keyboard and accessibility regression (synthetic API)
        run: node scripts/verify-app-a11y.mjs
      # T7/실제DB opt-in API 5파일은 구조화 runner의 명시 portable 범위에서 제외해 보고한다.
      # 실제 선택된 단언0개·내부SKIP·JSON결과 누락은 성공으로 처리하지 않는다.
      # scripts/local-*.test.mjs도 Mac/T7/로컬 프로세스 전용이다.
      # 브라우저 검사는 독립 정적 데모와 실제 앱의 합성 API/WS 화면·키보드 경로를 검사한다.
      # 실제 앱↔DB↔모델 통합, DB 마이그레이션·Docker sandbox·Ollama eval·통합 백업/복원은
      # 이 CI의 PASS 범위가 아니다. 전용 로컬 검증 결과는 docs/20-stage4-local-operations.md를 참조한다.
      # 이전 자동 배포 예제는 docs/examples/legacy-ci-deploy.yml로 옮겼으며 비활성 상태다.

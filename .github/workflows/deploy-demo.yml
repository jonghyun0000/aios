name: Deploy public demo

# 공개 체험판(apps/demo)만 Vercel Production에 올린다. 실제 로컬 제품(API·DB·모델)은 올리지 않는다.
# 재배포는 사용자 승인 사항이다(AGENTS.md, NEXT_STEPS §3.6). 승인은 GitHub Environment
# demo-production의 Required reviewers가 맡는다 — 이 설정이 없으면 이름만으로 게이트가 생기지 않는다.
# 설정 방법과 근거: docs/24-public-demo.md "자동 배포".
on:
  workflow_dispatch:
  push:
    branches: [main]
    # 제품 코드만 바뀐 커밋마다 승인 요청이 쌓이지 않게 체험판 관련 경로로 제한한다.
    paths:
      - apps/demo/**
      - vercel.json
      - .vercelignore
      - scripts/public-demo-policy.mjs
      - scripts/serve-public-demo.mjs
      - scripts/verify-public-demo.mjs
      - scripts/check-vercel-output.mjs
      - pnpm-lock.yaml
      - .github/workflows/deploy-demo.yml

permissions:
  contents: read

# 배포끼리 겹치지 않게 하고, 진행 중인 배포를 중간에 끊지 않는다.
concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  # 승인 전에 끝내는 검사. 이 잡은 배포 비밀값에 접근하지 않는다.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.12.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Demo unit tests
        run: pnpm --filter @aios/demo test
      - name: Demo and deploy-workflow policy tests
        run: node --test scripts/public-demo-policy.test.mjs
      - run: pnpm build:demo
      - run: pnpm --filter @aios/web exec playwright install --with-deps chromium
      - name: Browser regression on the local build
        run: node scripts/verify-public-demo.mjs

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: demo-production
      url: https://aios-demo-mu.vercel.app
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # 버전을 고정한다. latest를 쓰면 같은 커밋도 날마다 다른 도구로 배포된다.
      VERCEL_CLI: vercel@62.1.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.12.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pull production project settings
        run: pnpm dlx "$VERCEL_CLI" pull --yes --environment=production --token="$VERCEL_TOKEN"
      # 여기서 한 번만 빌드하고 그 결과를 그대로 올린다(--prebuilt). Vercel 서버에서 다시 빌드하면
      # 검사한 바이트와 공개된 바이트가 달라질 수 있다.
      - name: Build once with vercel.json headers
        run: pnpm dlx "$VERCEL_CLI" build --prod --token="$VERCEL_TOKEN"
      - name: Audit exactly the files to upload
        run: node scripts/check-vercel-output.mjs
      - name: Deploy prebuilt output to production
        run: pnpm dlx "$VERCEL_CLI" deploy --prebuilt --prod --token="$VERCEL_TOKEN"
      - run: pnpm --filter @aios/web exec playwright install --with-deps chromium
      # 공개 주소가 방금 올린 바이트를 내보내는지까지 확인해야 배포 성공이다.
      # 실패하면 Production에는 이미 반영된 상태다 — Vercel에서 이전 배포로 되돌린다(docs/24).
      - name: Verify the public production address
        env:
          AIOS_DEMO_URL: https://aios-demo-mu.vercel.app
          AIOS_DEMO_RETRY_SECONDS: "120"
        run: node scripts/verify-public-demo.mjs
